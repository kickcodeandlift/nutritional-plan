<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nutrition">
<meta name="robots" content="noindex, nofollow">
<title>Nutrition Plan</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e0f;
    --surface: #1a1a1c;
    --surface2: #242426;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.14);
    --text: #f0efe8;
    --text2: #8e8d85;
    --text3: #56554f;
    --accent: #c8f060;
    --accent-dim: rgba(200,240,96,0.12);
    --blue: #60b4f0;
    --blue-dim: rgba(96,180,240,0.12);
    --orange: #f0a060;
    --orange-dim: rgba(240,160,96,0.12);
    --purple: #b060f0;
    --purple-dim: rgba(176,96,240,0.12);
    --red: #f06060;
    --radius: 14px;
    --radius-sm: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    padding-bottom: 100px;
  }

  /* NAV */
  .nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex; z-index: 100;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .nav-btn {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 12px 0 10px; background: none; border: none; cursor: pointer;
    color: var(--text3); font-family: 'DM Sans', sans-serif;
    font-size: 10px; font-weight: 500; letter-spacing: .03em; transition: color .2s;
  }
  .nav-btn.active { color: var(--accent); }
  .nav-icon { width: 22px; height: 22px; stroke: currentColor; stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }

  /* PAGES */
  .page { display: none; padding: 0 0 1rem; }
  .page.active { display: block; }

  /* HEADER */
  .page-header {
    padding: 56px 20px 20px;
    background: linear-gradient(180deg, #1a1a1c 0%, transparent 100%);
    position: sticky; top: 0; z-index: 10;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  .page-title { font-size: 26px; font-weight: 600; letter-spacing: -.02em; line-height: 1.1; }
  .page-sub { font-size: 13px; color: var(--text2); margin-top: 4px; }

  /* DAY TOGGLE */
  .day-toggle { display: flex; gap: 8px; padding: 0 20px 16px; }
  .day-btn {
    flex: 1; padding: 10px 8px; border-radius: var(--radius-sm);
    border: 1px solid var(--border); background: var(--surface); color: var(--text2);
    font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 500;
    cursor: pointer; text-align: center; line-height: 1.3; transition: all .2s;
  }
  .day-btn.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }

  /* TOTALS */
  .totals-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 20px 20px; }
  .total-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
  .total-label { font-size: 11px; color: var(--text2); font-weight: 500; letter-spacing: .05em; text-transform: uppercase; margin-bottom: 4px; }
  .total-value { font-family: 'DM Mono', monospace; font-size: 24px; font-weight: 500; color: var(--text); line-height: 1; }
  .total-unit { font-size: 13px; color: var(--text2); font-weight: 400; font-family: 'DM Sans', sans-serif; margin-left: 2px; }
  .total-target { font-size: 11px; color: var(--text3); margin-top: 6px; font-family: 'DM Mono', monospace; }

  /* MEAL CARDS */
  .meals-list { padding: 0 20px; }
  .meal-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 12px; overflow: hidden; }
  .meal-top { padding: 14px 16px 10px; display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .meal-name { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .meal-time { font-size: 11px; color: var(--text3); font-weight: 400; margin-top: 3px; }
  .meal-tag { font-size: 10px; font-weight: 500; padding: 2px 8px; border-radius: 20px; background: var(--accent-dim); color: var(--accent); letter-spacing: .02em; }
  .meal-macros { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; }
  .mpill { font-size: 10px; font-weight: 500; font-family: 'DM Mono', monospace; padding: 2px 7px; border-radius: 20px; }
  .mpill-cal { background: var(--surface2); color: var(--text2); }
  .mpill-p { background: var(--accent-dim); color: var(--accent); }
  .mpill-c { background: var(--blue-dim); color: var(--blue); }
  .mpill-f { background: var(--orange-dim); color: var(--orange); }

  /* OPT TOGGLE */
  .opt-toggle { display: flex; gap: 6px; padding: 0 16px 10px; }
  .opt-btn {
    font-size: 11px; font-weight: 600; font-family: 'DM Mono', monospace;
    padding: 3px 14px; border-radius: 20px; border: 1px solid var(--border2);
    background: transparent; cursor: pointer; color: var(--text2); transition: all .15s;
  }
  .opt-btn.active { background: var(--text); color: var(--bg); border-color: var(--text); }

  /* ITEM LIST */
  .item-list { border-top: 1px solid var(--border); list-style: none; }
  .item-list li {
    display: flex; justify-content: space-between; align-items: center;
    padding: 9px 16px; font-size: 13px; color: var(--text2);
    border-bottom: 1px solid var(--border); gap: 8px;
  }
  .item-list li:last-child { border-bottom: none; }
  .item-list li span.kcal { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--text3); white-space: nowrap; }
  .opt-note { padding: 8px 16px 12px; font-size: 11px; color: var(--text3); border-top: 1px solid var(--border); }

  /* GENERIC BLOCKS (supps + guide) */
  .supp-block { padding: 0 20px; margin-bottom: 20px; }
  .supp-time-label { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text2); margin-bottom: 8px; padding-left: 2px; }
  .supp-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .supp-row { display: flex; align-items: center; padding: 11px 16px; border-bottom: 1px solid var(--border); gap: 10px; }
  .supp-row:last-child { border-bottom: none; }
  .supp-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
  .supp-dot.blue { background: var(--blue); }
  .supp-dot.orange { background: var(--orange); }
  .supp-dot.purple { background: var(--purple); }
  .supp-name { font-size: 14px; font-weight: 500; }
  .supp-note { font-size: 11px; color: var(--text3); margin-top: 1px; line-height: 1.4; }
  .supp-main { flex: 1; min-width: 0; }
  .supp-dose {
    font-size: 11px; font-weight: 500; font-family: 'DM Mono', monospace;
    padding: 3px 9px; border-radius: 20px; background: var(--purple-dim); color: var(--purple); white-space: nowrap;
  }
  .supp-dose.green { background: var(--accent-dim); color: var(--accent); }
  .supp-dose.blue { background: var(--blue-dim); color: var(--blue); }
  .supp-dose.orange { background: var(--orange-dim); color: var(--orange); }
  .info-card {
    margin: 0 20px 20px; padding: 14px 16px; border-radius: var(--radius);
    background: var(--orange-dim); border: 1px solid rgba(240,160,96,0.3);
    font-size: 12px; color: var(--orange); line-height: 1.5;
  }

  /* GROCERY PAGE */
  .grocery-header { padding: 0 20px 16px; }
  .progress-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
  .prog-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .prog-count { font-size: 13px; font-weight: 500; color: var(--text2); }
  .prog-pct { font-family: 'DM Mono', monospace; font-size: 14px; color: var(--accent); }
  .prog-track { height: 4px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
  .prog-fill { height: 4px; background: var(--accent); border-radius: 4px; transition: width .3s ease; }

  .grocery-cat { padding: 0 20px; margin-bottom: 20px; }
  .cat-label { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text2); margin-bottom: 8px; padding-left: 2px; }
  .grocery-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .grocery-row {
    display: flex; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border);
    gap: 12px; cursor: pointer; transition: background .15s; user-select: none;
  }
  .grocery-row:last-child { border-bottom: none; }
  .grocery-row:active { background: var(--surface2); }
  .grocery-row.checked { opacity: .45; }
  .g-check {
    width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--border2);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all .15s;
  }
  .grocery-row.checked .g-check { background: var(--accent); border-color: var(--accent); }
  .g-check svg { display: none; width: 11px; height: 11px; stroke: var(--bg); stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .grocery-row.checked .g-check svg { display: block; }
  .g-info { flex: 1; min-width: 0; }
  .g-name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .grocery-row.checked .g-name { text-decoration: line-through; }
  .g-note { font-size: 11px; color: var(--text3); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .g-qty { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--text2); white-space: nowrap; flex-shrink: 0; }
  .reset-btn {
    display: block; margin: 8px 20px 0; width: calc(100% - 40px); padding: 13px;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    color: var(--text2); font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500;
    cursor: pointer; transition: background .15s;
  }
  .reset-btn:active { background: var(--surface2); }
</style>
</head>
<body>

<!-- MEALS PAGE -->
<div class="page active" id="page-meals">
  <div class="page-header">
    <div class="page-title">Meal Plan</div>
    <div class="page-sub">Cut · Weeks 1–6 · tap A / B / C to switch</div>
  </div>
  <div class="day-toggle" id="meal-toggle">
    <button class="day-btn" data-day="gym" onclick="switchDay('gym')">Gym days<br><span style="font-size:11px;opacity:.7">Mon · Wed · Fri · Sat</span></button>
    <button class="day-btn" data-day="rest" onclick="switchDay('rest')">Rest days<br><span style="font-size:11px;opacity:.7">Tue · Thu · Sun</span></button>
  </div>
  <div class="totals-grid">
    <div class="total-card"><div class="total-label">Calories</div><div class="total-value" id="t-cal">—</div><div class="total-target" id="tt-cal"></div></div>
    <div class="total-card"><div class="total-label">Protein</div><div class="total-value" id="t-pro">—</div><div class="total-target" id="tt-pro"></div></div>
    <div class="total-card"><div class="total-label">Carbs</div><div class="total-value" id="t-carb">—</div><div class="total-target" id="tt-carb"></div></div>
    <div class="total-card"><div class="total-label">Fat</div><div class="total-value" id="t-fat">—</div><div class="total-target" id="tt-fat"></div></div>
  </div>
  <div class="meals-list" id="meals-list"></div>
</div>

<!-- GUIDE PAGE -->
<div class="page" id="page-guide">
  <div class="page-header">
    <div class="page-title">Guide</div>
    <div class="page-sub">Rules & swaps</div>
  </div>
  <div id="guide-list"></div>
</div>

<!-- SUPPLEMENTS PAGE -->
<div class="page" id="page-supps">
  <div class="page-header">
    <div class="page-title">Supplements</div>
    <div class="page-sub">Daily protocol</div>
  </div>
  <div class="day-toggle" id="supp-toggle">
    <button class="day-btn" data-day="gym" onclick="switchSuppDay('gym')">Gym days<br><span style="font-size:11px;opacity:.7">Mon · Wed · Fri · Sat</span></button>
    <button class="day-btn" data-day="rest" onclick="switchSuppDay('rest')">Rest days<br><span style="font-size:11px;opacity:.7">Tue · Thu · Sun</span></button>
  </div>
  <div id="supps-list"></div>
</div>

<!-- GROCERY PAGE -->
<div class="page" id="page-grocery">
  <div class="page-header">
    <div class="page-title">Grocery List</div>
    <div class="page-sub">Weekly shop · 4 gym + 3 rest days · tap to check off</div>
  </div>
  <div class="grocery-header">
    <div class="progress-wrap">
      <div class="prog-row">
        <span class="prog-count" id="prog-count">0 of 0 items</span>
        <span class="prog-pct" id="prog-pct">0%</span>
      </div>
      <div class="prog-track"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
    </div>
  </div>
  <div id="grocery-list"></div>
  <button class="reset-btn" onclick="resetGrocery()">Reset all items</button>
</div>

<!-- BOTTOM NAV -->
<nav class="nav">
  <button class="nav-btn active" onclick="showPage('meals',this)">
    <svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    Meals
  </button>
  <button class="nav-btn" onclick="showPage('guide',this)">
    <svg class="nav-icon" viewBox="0 0 24 24"><path d="M4 4h12a4 4 0 014 4v12H8a4 4 0 01-4-4z"/><path d="M8 9h8M8 13h6"/></svg>
    Guide
  </button>
  <button class="nav-btn" onclick="showPage('supps',this)">
    <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 2a4 4 0 0 1 4 4v1H8V6a4 4 0 0 1 4-4z"/><rect x="6" y="7" width="12" height="14" rx="2"/><path d="M9 12h6M9 16h4"/></svg>
    Supplements
  </button>
  <button class="nav-btn" onclick="showPage('grocery',this)">
    <svg class="nav-icon" viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><path d="M3 6h18M16 10a4 4 0 01-8 0"/></svg>
    Grocery
  </button>
</nav>

<script>
/* ---------- FOOD DATABASE (cereals & garlic rice from labels; others approx.) ---------- */
const FD = {
  wpi1:      {name:"1 scoop WPI",                         cal:115, p:26,   c:1,    f:0.5},
  wpi2:      {name:"2 scoops WPI",                        cal:230, p:52.4, c:2,    f:1},
  fibre24:   {name:"24g All-Bran Flakes (wheat or honey almond)", cal:88, p:2.8, c:14.5, f:1.1},
  cnut36:    {name:"36g Crunchy Nut",                     cal:145, p:2.5,  c:29.1, f:1.6},
  cnut20:    {name:"20g Crunchy Nut",                     cal:80,  p:1.4,  c:16.1, f:0.9},
  mix40:     {name:"40g cereal mix (16g All-Bran Flakes + 24g Crunchy Nut)", cal:155, p:3.5, c:29,   f:1.8},
  banana:    {name:"Fruit portion · banana or swap",      cal:100, p:1,    c:25,   f:0.3},
  kiwis:     {name:"Fruit portion · 2 kiwis or swap",     cal:90,  p:1.5,  c:20,   f:0.5},
  blue150:   {name:"150g blueberries or fruit swap",      cal:86,  p:1,    c:22,   f:0.5},
  yog200:    {name:"200g Greek yoghurt",                  cal:120, p:19,   c:9,    f:1},
  yog170:    {name:"170g Greek yoghurt",                  cal:102, p:16,   c:7.6,  f:0.9},
  chick150:  {name:"150g chicken breast (cooked)",        cal:248, p:46.5, c:0,    f:5.4},
  chick180:  {name:"180g chicken or lean beef (cooked)",  cal:297, p:56,   c:0,    f:6.5},
  chick200:  {name:"200g chicken or lean beef (cooked)",  cal:330, p:62,   c:0,    f:7.2},
  garlic:    {name:"250g Ben's garlic rice pouch (whole pack)", cal:406, p:8, c:79.6, f:5},
  salad:     {name:"Salad",                               cal:30,  p:2,    c:5,    f:0},
  veg:       {name:"Veg (fresh or frozen mix)",           cal:40,  p:2,    c:6,    f:0},
  oil10:     {name:"10g olive oil (or fat swap)",         cal:90,  p:0,    c:0,    f:10},
  pot200:    {name:"200g potato · or 160g frozen fries (skip the oil) · or ½ rice pouch", cal:154, p:4, c:34, f:0.2},
  pot150:    {name:"150g potato · or 130g frozen fries (skip the oil) · or ~90g rice",   cal:116, p:3,    c:26,   f:0.2},
  cor40:     {name:"40g cream of rice (dry)",             cal:145, p:2.5,  c:32,   f:0.3},
  pb15:      {name:"15g peanut butter",                   cal:95,  p:4,    c:2,    f:7.5},
  salmon150: {name:"150g salmon (cooked)",                cal:310, p:37,   c:0,    f:18},
  rice150:   {name:"150g cooked rice",                    cal:195, p:4,    c:42,   f:0.4},
  ricecake2: {name:"2 rice cakes",                        cal:75,  p:2,    c:16,   f:0.5},
  popcorn40: {name:"40g popcorn · 2 small multipack bags",cal:190, p:3,    c:22,   f:9},
  mchef:     {name:"Muscle Chef meal (≥40g P, ≤600 kcal)",cal:500, p:45,   c:45,   f:15},
  eggs3:     {name:"3 whole eggs",                        cal:225, p:19,   c:1.2,  f:15},
  eggs2:     {name:"2 whole eggs",                        cal:150, p:12.6, c:0.8,  f:10},
  whites300: {name:"300g liquid egg whites (carton)",     cal:156, p:33,   c:2.1,  f:0.6},
  omveg:     {name:"Omelette veg · spinach, tomato, mushroom", cal:40, p:2, c:6, f:0},
  toast2:    {name:"Bread · 2 slices (wholegrain or white) — see bread swaps", cal:165, p:6, c:28, f:2},
  toast1:    {name:"Bread · 1 slice (wholegrain or white) — see bread swaps",  cal:83,  p:3, c:14, f:1},
  muffin1:   {name:"1 Amino Z Muscle Muffin",             cal:230, p:20,   c:26.6, f:4.4},
  muffin2:   {name:"2 Amino Z Muscle Muffins",            cal:460, p:40,   c:53.2, f:8.8},
};
const I = (k, name) => name ? Object.assign({}, FD[k], {name}) : FD[k];

const TARGETS = {
  gym:  {cal:"~2,250", p:"~210", c:"~240", f:"~40–50"},
  rest: {cal:"~1,900", p:"~200", c:"~170", f:"~40"},
};

const lunch = {id:2, title:"Meal 2", time:"~1pm · lunch", options:[
  {label:"A", items:[I('chick150'), I('garlic'), I('salad')], note:"Garlic rice already has oil — no avocado or extra fat needed."},
  {label:"B", items:[I('mchef')], note:"Pick a meal with ≥40g protein. Under 40g? Add half a scoop of WPI."},
]};

const plans = {
  gym: { meals: [
    {id:1, title:"Meal 1", time:"~9–10am · coffee & water before", options:[
      {label:"A", items:[I('wpi2','2 scoops WPI mixed with water (as the "milk")'), I('fibre24'), I('cnut36'), I('banana')], note:"Your high-protein cereal bowl."},
      {label:"B", items:[I('yog200'), I('wpi1'), I('mix40'), I('banana')]},
      {label:"C", items:[I('muffin2'), I('wpi1','1 scoop WPI shake')], note:"Muscle Muffins — microwave with water, ready in a minute."},
    ]},
    lunch,
    {id:3, title:"Meal 3", tag:"Pre-workout", time:"~4–5pm if training after work · or before a morning session", options:[
      {label:"A", items:[I('cor40'), I('wpi1'), I('pb15'), I('kiwis')]},
      {label:"B", items:[I('yog170'), I('wpi1'), I('blue150'), I('cnut20')], note:"Yoghurt bowl."},
      {label:"C", items:[I('muffin2')], note:"Easiest pre-workout — macros almost identical to option A."},
    ]},
    {id:4, title:"Meal 4", time:"Dinner", options:[
      {label:"A", items:[I('chick180'), I('pot200'), I('veg'), I('oil10')]},
      {label:"B", items:[I('salmon150'), I('rice150'), I('veg')]},
      {label:"C", items:[I('eggs3'), I('whites300'), I('omveg'), I('toast2')], note:"Omelette — light and easy on late nights. Cook with spray oil, no extra fat needed."},
    ]},
  ]},
  rest: { meals: [
    {id:1, title:"Meal 1", time:"~9–10am · portable for city days", options:[
      {label:"A", items:[I('yog200'), I('wpi1','1 scoop WPI mixed in'), I('kiwis')], note:"Prep the tub the night before."},
      {label:"B", items:[I('wpi2','2 scoops WPI (shaker, water)'), I('mix40', '40g cereal mix — pack dry'), I('kiwis')], note:"Cereal bowl at the office: dry cereal in a container + shake."},
      {label:"C", items:[I('muffin1'), I('wpi1','1 scoop WPI shake')], note:"Needs an office microwave."},
    ]},
    lunch,
    {id:3, title:"Meal 3", time:"~4pm · office snack", options:[
      {label:"A", items:[I('wpi1','1 scoop WPI shake'), I('banana'), I('pb15')]},
      {label:"B", items:[I('wpi1','1 scoop WPI shake'), I('ricecake2'), I('pb15')]},
      {label:"C", items:[I('wpi1','1 scoop WPI shake'), I('popcorn40')], note:"Buy the multipack — the bag is the portion."},
      {label:"D", items:[I('muffin1'), I('wpi1','1 scoop WPI shake')]},
    ]},

/* ---------- STATE (remembered on this phone) ---------- */
function load(key, fallback){ try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch(e){ return fallback; } }
function save(key, val){ try { localStorage.setItem(key, JSON.stringify(val)); } catch(e){} }

const todayIsGym = [1,3,5,6].includes(new Date().getDay());
let mealDay = todayIsGym ? "gym" : "rest";
let suppDay = mealDay;
const mealSel = load('np2_sel', {gym:{}, rest:{}});
const groceryChecked = load('np2_groc', {});

const r = n => Math.round(n);
function sum(items){ return items.reduce((a,i)=>({cal:a.cal+i.cal,p:a.p+i.p,c:a.c+i.c,f:a.f+i.f}),{cal:0,p:0,c:0,f:0}); }
function getOpt(m){ return m.options.find(o=>o.label===mealSel[mealDay][m.id]) || m.options[0]; }

/* ---------- NAV ---------- */
function showPage(id, btn){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
  btn.classList.add('active');
  window.scrollTo(0,0);
}
function setToggle(id, day){
  document.querySelectorAll('#'+id+' .day-btn').forEach(b=>b.classList.toggle('active', b.dataset.day===day));
}

/* ---------- MEALS ---------- */
function switchDay(day){ mealDay = day; setToggle('meal-toggle', day); renderMeals(); }
function selectOpt(mealId, label){ mealSel[mealDay][mealId] = label; save('np2_sel', mealSel); renderMeals(); }

function renderMeals(){
  const plan = plans[mealDay];
  const T = sum(plan.meals.map(m=>sum(getOpt(m).items)));
  const tg = TARGETS[mealDay];
  document.getElementById('t-cal').innerHTML  = r(T.cal).toLocaleString()+'<span class="total-unit">kcal</span>';
  document.getElementById('t-pro').innerHTML  = r(T.p)+'<span class="total-unit">g</span>';
  document.getElementById('t-carb').innerHTML = r(T.c)+'<span class="total-unit">g</span>';
  document.getElementById('t-fat').innerHTML  = r(T.f)+'<span class="total-unit">g</span>';
  const mk = T.p*4 + T.c*4 + T.f*9;
  const pc = x => Math.round(x/mk*100)+'%';
  document.getElementById('tt-cal').textContent  = 'target '+tg.cal;
  document.getElementById('tt-pro').textContent  = pc(T.p*4)+' · target '+tg.p+'g';
  document.getElementById('tt-carb').textContent = pc(T.c*4)+' · target '+tg.c+'g';
  document.getElementById('tt-fat').textContent  = pc(T.f*9)+' · target '+tg.f+'g';

  const container = document.getElementById('meals-list');
  container.innerHTML = '';
  plan.meals.forEach(m=>{
    const opt = getOpt(m);
    const s = sum(opt.items);
    let toggle = '';
    if (m.options.length > 1){
      toggle = '<div class="opt-toggle">' + m.options.map(o=>
        `<button class="opt-btn${o.label===opt.label?' active':''}" onclick="selectOpt(${m.id},'${o.label}')">${o.label}</button>`
      ).join('') + '</div>';
    }
    const items = '<ul class="item-list">' + opt.items.map(i=>`<li><span>${i.name}</span><span class="kcal">${r(i.cal)} kcal</span></li>`).join('') + '</ul>';
    const note = opt.note ? `<div class="opt-note">${opt.note}</div>` : '';
    const tag = m.tag ? `<span class="meal-tag">${m.tag}</span>` : '';
    const card = document.createElement('div');
    card.className = 'meal-card';
    card.innerHTML = `
      <div class="meal-top">
        <div>
          <div class="meal-name">${m.title}${tag}</div>
          <div class="meal-time">${m.time||''}</div>
        </div>
        <div class="meal-macros">
          <span class="mpill mpill-cal">${r(s.cal)}kcal</span>
          <span class="mpill mpill-p">${r(s.p)}P</span>
          <span class="mpill mpill-c">${r(s.c)}C</span>
          <span class="mpill mpill-f">${r(s.f)}F</span>
        </div>
      </div>
      ${toggle}${items}${note}`;
    container.appendChild(card);
  });
}

/* ---------- GUIDE ---------- */
function renderGuide(){
  const container = document.getElementById('guide-list');
  container.innerHTML = guide.map(block=>`
    <div class="supp-block">
      <div class="supp-time-label">${block.title}</div>
      <div class="supp-card">
        ${block.rows.map(row=>`
          <div class="supp-row">
            ${row.dot ? `<div class="supp-dot ${row.dot==='accent'?'':row.dot}"></div>` : ''}
            <div class="supp-main">
              <div class="supp-name">${row.name}</div>
              <div class="supp-note">${row.note}</div>
            </div>
            ${row.dose ? `<span class="supp-dose ${row.c||''}">${row.dose}</span>` : ''}
          </div>`).join('')}
      </div>
    </div>`).join('');
}

          <div class="supp-row">
            <div class="supp-dot"></div>

              <div class="supp-note">${s.note}</div>
            </div>
            <span class="supp-dose">${s.dose}</span>
          </div>`).join('')}
      </div>
    </div>`).join('');
}

/* ---------- GROCERY ---------- */
function renderGrocery(){
  const container = document.getElementById('grocery-list');
  container.innerHTML = '';
  groceries.forEach((cat,ci)=>{
    const sec = document.createElement('div');
    sec.className = 'grocery-cat';
    let html = `<div class="cat-label">${cat.category}</div><div class="grocery-card">`;
    cat.items.forEach((item,ii)=>{
      const id = `g-${ci}-${ii}`;
      if (!(id in groceryChecked)) groceryChecked[id] = false;
      html += `<div class="grocery-row${groceryChecked[id]?' checked':''}" id="${id}" onclick="toggleGrocery('${id}')">
        <div class="g-check"><svg viewBox="0 0 11 11"><polyline points="1.5,5.5 4,8 9.5,2"/></svg></div>
        <div class="g-info"><div class="g-name">${item.name}</div><div class="g-note">${item.note}</div></div>
        <span class="g-qty">${item.qty}</span>
      </div>`;
    });
    sec.innerHTML = html + '</div>';
    container.appendChild(sec);
  });
  updateProgress();
}
function toggleGrocery(id){
  groceryChecked[id] = !groceryChecked[id];
  document.getElementById(id).classList.toggle('checked', groceryChecked[id]);
  save('np2_groc', groceryChecked);
  updateProgress();
}
function resetGrocery(){
  Object.keys(groceryChecked).forEach(k=>groceryChecked[k]=false);
  document.querySelectorAll('.grocery-row').forEach(r=>r.classList.remove('checked'));
  save('np2_groc', groceryChecked);
  updateProgress();
}
function updateProgress(){
  const ids = Array.from(document.querySelectorAll('.grocery-row')).map(r=>r.id);
  const done = ids.filter(id=>groceryChecked[id]).length;
  const pct = ids.length ? Math.round(done/ids.length*100) : 0;
  document.getElementById('prog-count').textContent = `${done} of ${ids.length} items`;
  document.getElementById('prog-pct').textContent = pct+'%';
  document.getElementById('prog-fill').style.width = pct+'%';
}

/* ---------- INIT ---------- */
setToggle('meal-toggle', mealDay);
setToggle('supp-toggle', suppDay);
renderMeals();
renderGuide();
renderSupps();
renderGrocery();
